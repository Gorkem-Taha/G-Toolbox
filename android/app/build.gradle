plugins {
    id 'com.android.application'
}

// App version comes from the single source of truth: gtoolbox/__init__.py
def appVersion = (rootProject.file("../gtoolbox/__init__.py").text =~ /__version__\s*=\s*"(\d+)\.(\d+)\.(\d+)"/)[0]
def appVersionName = "${appVersion[1]}.${appVersion[2]}.${appVersion[3]}"
def appVersionCode = (appVersion[1] as int) * 10000 + (appVersion[2] as int) * 100 + (appVersion[3] as int)

android {
    namespace 'com.gtoolbox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gtoolbox.app"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing only when the keystore is provided (CI secrets or local env);
    // otherwise `assembleRelease` produces an unsigned APK.
    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
