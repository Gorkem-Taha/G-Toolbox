name: Build Linux AppImage

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'scripts/build_appimage.sh'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/build-appimage.yml'
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build-appimage:
    # Oldest supported runner = widest glibc compatibility for the bundled Python
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Everything (Python, dependencies, ffmpeg, AppImage runtime) is bundled
      # and hash-verified by the script; no system Python packages are used.
      - name: Build G-Toolbox AppImage
        run: ./scripts/build_appimage.sh

      - name: Smoke test
        run: |
          mkdir -p /tmp/ai && cd /tmp/ai
          ARCH=x86_64 "$GITHUB_WORKSPACE/dist/G-Toolbox-x86_64.AppImage" --appimage-extract >/dev/null
          XDG_DATA_HOME=/tmp/ai-data ./squashfs-root/AppRun --no-browser &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/check-update && break; sleep 1; done
          curl -fs -o /dev/null http://127.0.0.1:8000/
          ./squashfs-root/usr/bin/ffmpeg -version | head -1

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: G-Toolbox-Linux-x86_64-AppImage
          path: dist/G-Toolbox-x86_64.AppImage
          if-no-files-found: error

  attach-to-release:
    if: github.event_name == 'release'
    needs: build-appimage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: G-Toolbox-Linux-x86_64-AppImage
      - uses: softprops/action-gh-release@v2
        with:
          files: G-Toolbox-x86_64.AppImage
