name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Reject a tampered gradle-wrapper.jar before running it
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GitHub's Ubuntu runners ship an Android SDK (ANDROID_HOME); the Android
      # Gradle plugin fetches any missing platform/build-tools itself.
      # (android-actions/setup-android@v3 broke: it installs the removed 'tools' package.)
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # Signed release build when the keystore secrets exist, debug build otherwise
      - name: Build and lint
        working-directory: ./android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease lintRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../dist/G-Toolbox.apk
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No release keystore configured; publishing a debug-signed APK."
            ./gradlew assembleDebug lintDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/G-Toolbox.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: G-Toolbox-Android-APK
          path: dist/G-Toolbox.apk
          retention-days: 14
